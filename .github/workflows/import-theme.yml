name: Import Imanelli Shopify theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and validate theme
        run: |
          mkdir -p imported-theme
          curl --fail --location --retry 3 \
            "https://github.com/user-attachments/files/30858667/Imanelli-Couture-Dawn-1.7.1-Crop-Fixed.zip" \
            --output /tmp/imanelli-theme.zip
          unzip -q /tmp/imanelli-theme.zip -d imported-theme
          for directory in assets config layout locales sections snippets templates; do
            test -d "imported-theme/$directory"
          done

      - name: Install theme at repository root
        run: |
          for directory in assets config layout locales sections snippets templates; do
            rm -rf "$directory"
            cp -R "imported-theme/$directory" "$directory"
          done
          rm -rf imported-theme
          rm -f README.md
          rm -f .github/workflows/import-theme.yml

      - name: Commit Shopify theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Imanelli Couture Shopify theme v1.7.1"
          git push
